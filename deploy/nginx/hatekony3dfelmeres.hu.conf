# hatekony3dfelmeres.hu — csak ez a vhost. Ne kerüljön a site-1, site-6 vagy site-7 konfigurációjába.
# A nyilvános domain upstreamje: 127.0.0.1:8000

server {
    listen 80;
    listen [::]:80;
    server_name www.hatekony3dfelmeres.hu;
    return 301 http://hatekony3dfelmeres.hu$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name hatekony3dfelmeres.hu;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

