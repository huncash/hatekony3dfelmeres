<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <title>Terepi jegyzék szemléltetés</title>
  <rect width="640" height="400" fill="#faf8f4"/>
  <rect x="70" y="50" width="500" height="300" fill="#fff" stroke="#1e3d38" stroke-width="2"/>
  <g stroke="#d5d0c6" fill="none">
    <path d="M100 110H540M100 150H540M100 190H540M100 230H540M100 270H540"/>
  </g>
  <text x="100" y="96" fill="#8f3d16" font-family="Segoe UI, sans-serif" font-size="16">Zőna, időablak, takarás</text>
  <text x="100" y="142" fill="#1a2420" font-family="Segoe UI, sans-serif" font-size="15">4-5 tengely: a padló az áru alatt nem látszott</text>
  <text x="100" y="182" fill="#1a2420" font-family="Segoe UI, sans-serif" font-size="15">Kapu: 20 perces múszakváltás</text>
  <text x="100" y="222" fill="#1a2420" font-family="Segoe UI, sans-serif" font-size="15">Vezeték: csak a kúlső palást mérhető</text>
  <text x="100" y="330" fill="#3e4c47" font-family="Segoe UI, sans-serif" font-size="14">Szemléltető jegyzék, nem valós helyszín.</text>
</svg>
